<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores Amarillas 🌻</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f6f5f0;
      font-family: 'Georgia', serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    /* Botón Inicial con Imagen */
    #start-screen {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      cursor: pointer;
    }

    .flower-btn-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease;
    }

    .flower-btn-img:hover {
      transform: scale(1.1);
    }

    /* Contenedor Principal (Escritorio / Computadora) */
    #main-container {
      display: flex;
      flex-direction: row;
      width: 90vw;
      max-width: 1100px;
      min-height: 85vh;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0;
    }

    .hidden {
      display: none !important;
    }

    /* Panel de Texto */
    .text-container {
      width: 48%;
      padding: 20px;
      color: #2c3e50;
      line-height: 1.8;
    }

    .text-container h2 {
      font-size: 1.3rem;
      margin-bottom: 20px;
      color: #1a252f;
    }

    .text-container p, .text-container h3 {
      margin-bottom: 15px;
      font-size: 0.95rem;
      letter-spacing: 1px;
    }

    .cursive {
      font-style: italic;
      font-family: 'Times New Roman', serif;
      margin-top: 25px;
      border-top: 1px solid #ccc;
      padding-top: 10px;
    }

    /* Canvas para el árbol */
    .canvas-container {
      width: 48%;
      height: 500px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    canvas {
      width: 100%;
      height: 100%;
    }

    /* Adaptación para Celulares (Mobile View) */
    @media (max-width: 768px) {
      body {
        overflow-y: auto;
        align-items: flex-start;
      }

      #main-container {
        flex-direction: column; /* Texto arriba, árbol abajo */
        width: 95vw;
        height: auto;
        padding: 15px 5px 30px 5px;
        justify-content: flex-start;
      }

      .text-container {
        width: 100%;
        padding: 10px;
        text-align: center;
      }

      .text-container h2 {
        font-size: 1.15rem;
        margin-bottom: 15px;
      }

      .text-container p, .text-container h3 {
        font-size: 0.88rem;
        margin-bottom: 10px;
      }

      .canvas-container {
        width: 100%;
        height: 380px; /* Tamaño adaptado para pantalla de móvil */
        margin-top: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- Botón Inicial con Imagen -->
  <div id="start-screen">
    <img src="https://img.magnific.com/psd-gratis/hermosa-rosa-estudio_23-2151841221.jpg?semt=ais_hybrid&w=740&q=80" alt="Rosa" class="flower-btn-img" id="btn-start">
  </div>

  <!-- Vista Principal -->
  <div id="main-container" class="hidden">
    <div class="text-container">
      <h2 id="title">🌻 FELIZ DÍA DE LAS FLORES AMARILLAS 🌻</h2>
      <p id="p1"></p>
      <p id="p2"></p>
      <p id="p3"></p>
      <h3 id="p4"></h3>
      <p id="footer-text" class="cursive"></p>
    </div>

    <div class="canvas-container">
      <canvas id="treeCanvas"></canvas>
    </div>
  </div>

  <script>
    const btnStart = document.getElementById('btn-start');
    const startScreen = document.getElementById('start-screen');
    const mainContainer = document.getElementById('main-container');
    const canvas = document.getElementById('treeCanvas');
    const ctx = canvas.getContext('2d');

    btnStart.addEventListener('click', () => {
      startScreen.classList.add('hidden');
      mainContainer.classList.remove('hidden');
      resizeCanvas();
      startTreeAnimation();
    });

    function resizeCanvas() {
      const container = canvas.parentElement;
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }

    window.addEventListener('resize', () => {
      if (!mainContainer.classList.contains('hidden')) {
        resizeCanvas();
      }
    });

    function startTreeAnimation() {
      const isMobile = window.innerWidth <= 768;
      const startX = canvas.width / 2;
      const startY = canvas.height - 15;
      
      // Ajuste de escala según pantalla
      const scale = isMobile ? 8.5 : 11;
      const trunkHeight = isMobile ? 120 : 160;
      const heartOffsetY = isMobile ? 210 : 270;

      // Dibujar Tronco
      ctx.beginPath();
      ctx.moveTo(startX - 10, startY);
      ctx.lineTo(startX + 10, startY);
      ctx.lineTo(startX + 5, startY - trunkHeight);
      ctx.lineTo(startX - 5, startY - trunkHeight);
      ctx.fillStyle = '#1e5d3b';
      ctx.fill();

      // Puntos con forma de corazón
      let flowers = [];
      for (let t = 0; t < Math.PI * 2; t += 0.05) {
        let x = 16 * Math.pow(Math.sin(t), 3);
        let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
        
        for (let r = 0; r < 1; r += 0.08) {
          flowers.push({
            x: startX + (x * scale * r) + (Math.random() * 12 - 6),
            y: (startY - heartOffsetY) + (y * scale * r) + (Math.random() * 12 - 6)
          });
        }
      }

      // Animación fluida
      let count = 0;
      let interval = setInterval(() => {
        if (count < flowers.length) {
          for (let i = 0; i < 3 && count < flowers.length; i++) {
            drawSunflower(flowers[count].x, flowers[count].y, isMobile ? 4 : 5);
            count++;
          }
        } else {
          clearInterval(interval);
          typeWriterEffect();
        }
      }, 10);
    }

    function drawSunflower(x, y, radius) {
      // Pétalos
      ctx.beginPath();
      ctx.arc(x, y, radius + 2.5, 0, Math.PI * 2);
      ctx.fillStyle = '#f1c40f';
      ctx.fill();

      // Centro
      ctx.beginPath();
      ctx.arc(x, y, radius / 1.8, 0, Math.PI * 2);
      ctx.fillStyle = '#3e2723';
      ctx.fill();
    }

    // Animación de texto estilo máquina de escribir
    const texts = [
      { id: 'p1', text: 'Esta es la primera primavera que vivo contigo, y no sabes lo lindo que es ver cómo florece todo al mismo tiempo que te veo' },
      { id: 'p2', text: 'Cada día contigo es un regalo, y cada sonrisa tuya ilumina mi mundo' },
      { id: 'p3', text: 'Te amo muchisimo más de lo que mis palabras pueden expresar' },
      { id: 'p4', text: 'Sos la primavera que hace florecer cada uno de mis días' },
      { id: 'footer-text', text: 'TE AMOOOOOOOOOOOO' }
    ];

    function typeWriterEffect() {
      let lineIndex = 0;
      let charIndex = 0;

      function type() {
        if (lineIndex < texts.length) {
          let currentObj = texts[lineIndex];
          let element = document.getElementById(currentObj.id);
          
          if (charIndex < currentObj.text.length) {
            element.textContent += currentObj.text.charAt(charIndex);
            charIndex++;
            setTimeout(type, 30);
          } else {
            charIndex = 0;
            lineIndex++;
            setTimeout(type, 200);
          }
        }
      }
      type();
    }
  </script>
</body>
</html>
